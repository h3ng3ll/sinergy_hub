workflows:
  web-deploy:
    name: Web Deploy

#    triggering:
#      events:
#        - push
#      branch_patterns:
#        - pattern: main
#          include: true

    environment:
      flutter: 3.41.7
      groups:
        - env
        - files
        - notifier
      vars:
        FIREBASE_PROJECT_ID: synergyhub-a3e1b
    cache:
      cache_paths:
        - ~/.pub-cache
        - .flutter
        - build/
    scripts:
      - name: Prepare
        script: set -euo pipefail

      - name: Get packages
        script: flutter pub get

      - name: Code generation
        script: dart run build_runner build -d

      #      - name: Create firebase options File
      #        script:  echo "$FIREBASE_OPTIONS" > lib/firebase/firebase_options_dev.dart

      - name: Create firebase.json file
        script: echo "$FIREBASE_JSON" > firebase.json

      - name: Create .env file
        script: |
          echo "$env" > .env

      - name: Build web
        script: |
          flutter build web \
            --dart-define=DARTENV=development \
            --dart-define=DEV_SERVER_CLIENT_ID="DEV_SERVER_CLIENT_ID" \
            --dart-define=DEV_FIREBASE_WEB_PUSH_CERTIFICATE="$DEV_FIREBASE_WEB_PUSH_CERTIFICATE" \
            --dart-define=FIREBASE_PROJECT_WEB_URL="FIREBASE_PROJECT_WEB_URL" \
            --release

      - name: Deploy to Firebase
        script: |
          firebase deploy \
            --only hosting \
            --project $FIREBASE_PROJECT_ID \
            --token $FIREBASE_TOKEN

      - name: Telegram notify
        script: |
          if [ "$CM_BUILD_STATUS" = "success" ]; then
            MESSAGE="✅ Build succeeded"
          else
            MESSAGE="❌ Build failed"
          fi
          
          DEPLOY_URL="https://$FIREBASE_PROJECT_ID.web.app"
          
          MESSAGE="$STATUS%0A🚀 Deploy: $DEPLOY_URL%0A📦 Build: $CM_BUILD_ID"
          
          curl -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -d chat_id=$TELEGRAM_CHAT_ID \
          -d text="$MESSAGE"
  
  

  upload_ios_metadata:
    name: Upload iOS metadata
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: 16.2
      groups:
        - store_credentials
      vars:
        APP_NAME: $APPSTORE_APP_NAME

    scripts:
      - name: Print working dir & contents
        script: |
          echo "PWD: $(pwd)"
          ls -R

      - name: Install Ruby dependencies
        script: |
          bundle install || bundle install --path vendor/bundle
          gem install fastlane-plugin-appicon || true

      - name: Validate metadata directory structure
        script: |
          echo "===== Validating Metadata ====="
          # Check that metadata folder exists
          if [ ! -d "./fastlane/metadata" ]; then
            echo "ERROR: Metadata directory not found at ./fastlane/metadata"
            exit 1
          fi

          # Check that en-US folder exists (primary required locale)
          if [ ! -d "./fastlane/metadata/en-US" ]; then
            echo "ERROR: No en-US metadata folder found in ./fastlane/metadata"
            exit 1
          fi

          # List and count all locale folders
          echo "Scanning metadata locales..."
          find ./fastlane/metadata -maxdepth 1 -type d | grep -v "^./fastlane/metadata$" | grep -v "review_information" | sort | while read LOCALE_DIR; do
            LOCALE=$(basename "$LOCALE_DIR")
            echo "Processing metadata locale: $LOCALE"

            # Check for required metadata files in each locale
            REQUIRED_FILES=("name.txt" "description.txt" "keywords.txt")
            MISSING=0
            for FILE in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$LOCALE_DIR/$FILE" ]; then
                echo "  - WARNING: $FILE is missing in $LOCALE"
                MISSING=$((MISSING+1))
              fi
            done

            if [ $MISSING -eq 0 ]; then
              echo "  - All required files present in $LOCALE"
            else
              echo "  - $MISSING required files missing in $LOCALE"
            fi
          done

          # Verify required files exist in en-US (this is a must)
          REQUIRED_FILES=("name.txt" "description.txt" "keywords.txt" "privacy_url.txt" "support_url.txt")
          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "./fastlane/metadata/en-US/$FILE" ]; then
              echo "ERROR: Required metadata file ./fastlane/metadata/en-US/$FILE is missing"
              exit 1
            fi
          done

          # Count language folders
          LANGUAGE_FOLDERS=$(find ./fastlane/metadata -maxdepth 1 -type d | grep -v "^./fastlane/metadata$" | grep -v "review_information" | wc -l)
          echo "Found $LANGUAGE_FOLDERS language folders in metadata"

          # Check for review_information
          if [ -d "./fastlane/metadata/review_information" ]; then
            echo "Review information folder found"
            REVIEW_FILES=$(find "./fastlane/metadata/review_information" -type f | wc -l)
            echo "Found $REVIEW_FILES files in review_information"
          else
            echo "WARNING: No review_information folder found - this might be needed for new app submissions"
          fi

          echo "Metadata validation successful!"

      - name: Upload metadata via fastlane deliver
        script: |
          bundle exec fastlane ios upload_metadata

    artifacts:
      - fastlane/logs/**/*


  ios-workflow:
    name: iOS Workflow

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    cache:
      cache_paths:
        - ~/.pub-cache
        - .flutter
        - build/
        - ~/.cocoapods
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: sinergyhub
    environment:
      groups:
        - store_credentials
        - files
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $IOS_BUNDLE_ID
      vars:
        BUNDLE_ID: "$IOS_BUNDLE_ID"
        APP_STORE_APPLE_ID: $APPSTORE_APP_ID
      flutter: 3.41.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles --verbose
      - name: Clean Flutter project
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Create firebase.json file
        script: |
          pwd
          echo "$FIREBASE_JSON" > firebase.json
          cat firebase.json
      - name: Activate FlutterFire CLI
        script: |
          dart pub global activate flutterfire_cli
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/export_options.plist \
            --flavor=prod \
            --dart-define=DARTENV=prod \
            --dart-define=PROD_SERVER_CLIENT_ID="$PROD_SERVER_CLIENT_ID" \
            --dart-define=PROD_FIREBASE_WEB_PUSH_CERTIFICATE="$PROD_FIREBASE_WEB_PUSH_CERTIFICATE" 

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APPSTORE_P8 # <--
        key_id: $APPSTORE_KEY_ID # <--
        issuer_id: $APPSTORE_ISSUER_ID # <--
        submit_to_testflight: true

        # Configuration related to App Store (optional)
        # Note: This action is performed during post-processing.
        submit_to_app_store: false