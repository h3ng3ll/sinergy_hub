workflows:
  web-deploy:
    name: Web Deploy

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      flutter: 3.38.5
      dart:  3.10.4
      groups:
        - env
      vars:
        FIREBASE_PROJECT_ID: synergyhub-a3e1b
    cache:
      cache_paths:
        - ~/.pub-cache
        - .flutter
        - build/
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Code generation
        script: dart run build_runner build -d

      - name: Build web
        script: flutter build web --release

      - name: Install Firebase CLI
        script: npm install -g firebase-tools

      - name: Deploy to Firebase
        script: |
          firebase deploy \
            --only hosting \
            --project $FIREBASE_PROJECT_ID \
            --token $FIREBASE_TOKEN

