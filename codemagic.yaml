workflows:
  web-deploy:
    name: Web Deploy

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      flutter: 3.38.5
      groups:
        - env
        - files
      vars:
        FIREBASE_PROJECT_ID: synergyhub-a3e1b
    cache:
      cache_paths:
        - ~/.pub-cache
        - .flutter
        - build/
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Code generation
        script: dart run build_runner build -d

      - name: Create firebase options File
        script:  echo "$FIREBASE_OPTIONS" > lib/firebase_options.dart

      - name: Create .env file
        script: |
          echo "FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY" > .env
          echo "FIREBASE_WEB_PUSH_CERTIFICATE=$FIREBASE_WEB_PUSH_CERTIFICATE" >> .env

      - name: Build web
        script: flutter build web --release

      - name: Deploy to Firebase
        script: |
          firebase deploy \
            --only hosting \
            --project $FIREBASE_PROJECT_ID \
            --token $FIREBASE_TOKEN

